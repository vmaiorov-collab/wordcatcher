name: Android APK

on:
  push:
    paths:
      - "android/**"
      - "docs/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../wordcatcher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wordcatcher-apk
          path: wordcatcher.apk
      - name: Publish the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest wordcatcher.apk \
            --target "$GITHUB_SHA" \
            --title "Wordcatcher для Android" \
            --notes "Свежая сборка из main (${GITHUB_SHA::7}). Скачай wordcatcher.apk на телефон и открой."
