<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wordcatcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">Word<span>catcher</span></div>
    <nav class="tabs" id="tabs">
      <button data-view="read" class="active">Читать</button>
      <button data-view="words">Слова <span class="badge" id="count">0</span></button>
      <button data-view="quiz">Квиз</button>
    </nav>
    <label class="lang">
      Перевод на
      <select id="lang">
        <option value="ru">Русский</option>
        <option value="uk">Українська</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="it">Italiano</option>
        <option value="pt">Português</option>
        <option value="tr">Türkçe</option>
        <option value="pl">Polski</option>
      </select>
    </label>
  </header>

  <main>
    <!-- READ -->
    <section id="view-read" class="view active">
      <form id="url-form" class="loader">
        <input id="url" type="url" placeholder="Вставь ссылку на статью, например https://www.bbc.com/news/..." autocomplete="off">
        <button type="submit" id="load-btn">Загрузить</button>
      </form>
      <div class="loader-sub">
        <button type="button" class="link" id="toggle-paste">или вставить текст вручную</button>
      </div>
      <form id="paste-form" class="paste hidden">
        <textarea id="paste-text" rows="6" placeholder="Вставь сюда текст статьи"></textarea>
        <button type="submit">Показать текст</button>
      </form>

      <div id="status" class="status hidden"></div>

      <article id="article" class="article hidden">
        <div class="meta" id="meta"></div>
        <h1 id="title"></h1>
        <div id="body"></div>
      </article>

      <div id="empty-read" class="empty">
        <p>Вставь ссылку на статью (BBC, The Guardian и т.д.).</p>
        <p>Нажми на слово или выдели фразу, и увидишь перевод. Слово сразу попадёт в твой список.</p>
      </div>
    </section>

    <!-- WORDS -->
    <section id="view-words" class="view">
      <div class="bar">
        <h2>Мои слова</h2>
        <div class="bar-actions">
          <input id="search" type="search" placeholder="Поиск">
          <button id="export" class="ghost">Скачать CSV</button>
          <button id="clear" class="ghost danger">Очистить всё</button>
        </div>
      </div>
      <ul id="word-list" class="word-list"></ul>
      <div id="empty-words" class="empty hidden"><p>Пока пусто. Открой статью и нажми на слово.</p></div>
    </section>

    <!-- QUIZ -->
    <section id="view-quiz" class="view">
      <div class="bar">
        <h2>Квиз</h2>
        <div class="bar-actions">
          <select id="quiz-mode">
            <option value="cards">Карточки</option>
            <option value="choice">Выбор ответа</option>
          </select>
          <select id="quiz-dir">
            <option value="fwd">Слово → перевод</option>
            <option value="rev">Перевод → слово</option>
          </select>
          <button id="quiz-start">Начать</button>
        </div>
      </div>
      <div id="quiz-area" class="quiz-area"></div>
    </section>
  </main>

  <div id="popup" class="popup hidden" role="dialog">
    <div class="pop-head">
      <span id="pop-word" class="pop-word"></span>
      <button id="pop-speak" class="icon" title="Произношение">🔊</button>
      <button id="pop-close" class="icon" title="Закрыть">✕</button>
    </div>
    <div id="pop-tr" class="pop-tr"></div>
    <div id="pop-ctx" class="pop-ctx"></div>
    <div class="pop-foot">
      <span id="pop-state" class="pop-state"></span>
      <button id="pop-toggle" class="link"></button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mozilla/readability@0.5.0/Readability.js"></script>
  <script src="app.js"></script>
</body>
</html>
